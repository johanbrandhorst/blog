# Blowfish theme parameters. Anything not set here uses the theme default,
# see https://blowfish.page/docs/configuration/#theme-parameters.

colorScheme = "blowfish"
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

[header]
  layout = "basic"

[footer]
  showMenu = false
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom" # layouts/partials/home/custom.html
  showRecent = false
  buttons = [
    { name = "Blog", url = "post/" },
    { name = "About", url = "page/about/" },
  ]

[article]
  showDate = true
  showAuthor = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showWordCount = false
  showTableOfContents = true
  showTaxonomies = true
  seriesOpened = true
  showRelatedContent = true
  relatedContentLimit = 3

[list]
  showSummary = true
  groupByYear = true

[taxonomy]
  showTermCount = true

[term]
  showTableOfContents = false
