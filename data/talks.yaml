# Talks and podcasts, newest first. Rendered by the talks shortcode on the
# presentations page.
#
# Fields:
#   id:      anchor for linking directly to a talk (keep stable, old links use them)
#   title:   talk title
#   event:   where it was given
#   year:    year it was given
#   blurb:   a sentence or two about the talk
#   youtube: YouTube video ID, used for the thumbnail and video link
#   start:   optional YouTube start offset in seconds
#   video:   video link when not on YouTube
#   podcast: episode link, for podcast appearances
#   links:   extra links as name/url pairs (slides, repos, event pages)

